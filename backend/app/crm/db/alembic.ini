[alembic]
# script_location is relative to this file, which lives in backend/app/crm/db/
script_location = %(here)s/migrations
prepend_sys_path = .

# sqlalchemy.url is overridden in env.py from the DATABASE_URL env-var.
# Never put a real connection string here — see RULES.md (never commit .env).
sqlalchemy.url = override_in_env_py

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
